aid: bizzycar
name: BizzyCar
description: 'BizzyCar is a B2B SaaS platform for automotive dealerships that automates
  service recall management, customer outreach and mobile service. Founded in 2018
  and headquartered in Saint Peters, Missouri, the company ingests VIN-level open-recall
  data from OEM partners, matches it against a dealer''s market area and DMS records,
  then uses AI-driven outreach (SMS, email, voice) to book service appointments and
  dispatch mobile service vans. Products include Recall Outreach, Recall Scout, Recall
  Radar, Service Engine, Mobile Service and Fleet IQ. BizzyCar is primarily an API
  *consumer* rather than an API producer: it ships pre-built connectors into dealer
  management systems (Dealertrack, DMS Plus, Open/Mate, Asbury, PBS, Tekion, Fortellis,
  Reynolds & Reynolds) and service schedulers (Xtime, TCC, DealerFX, Affinitiv, Update
  Promise), but publishes no public developer program, API reference or machine-readable
  contract of its own.'
